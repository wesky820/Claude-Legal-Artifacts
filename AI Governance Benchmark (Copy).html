<!doctype html>

<meta charset="utf-8"><title>AI Governance Benchmark (Copy)</title>
<script>(() => {
  // artifact.json
  var key = "legal-ai-governance-health-check";
  var monitoring = {
    alertChannel: "appifacts-alerts",
    coreActions: []
  };

  // ../../packages/appifact-health/src/vocabulary.ts
  var CORE_ACTIONS = [
    "save",
    "open",
    "render",
    "edit",
    "sync",
    "export",
    "import",
    "present",
    "navigate",
    "search",
    "submit",
    "upload",
    "download",
    "generate",
    "connect",
    "insert",
    "delete",
    "reorder"
  ];
  var OUTCOMES = ["success", "failure", "aborted"];
  var ERROR_TYPE_RE = /^[a-z][a-z0-9_]{0,31}$/;
  var ERROR_TYPES = [
    "conflict",
    "read_only",
    "too_large",
    "invalid_content",
    "backpressure",
    "transient",
    "network",
    "timeout",
    "first_result_timeout",
    "validation",
    "capability_denied",
    "capability_error",
    "render",
    "internal",
    "user_error",
    "helper_timeout",
    "helper_error",
    "helper_start_timeout",
    "helper_init_timeout",
    "dom_encoding_error",
    "dom_operation_error",
    "dom_not_supported_error",
    "dom_invalid_state_error",
    "dom_quota_exceeded_error",
    "dom_security_error",
    "unknown"
  ];
  var KNOWN_ERROR_TYPES = new Set([
    "boot_4xx",
    "boot_5xx",
    "iframe_timeout",
    "iframe_error",
    "kernel_missing",
    "csp_violation",
    "cap_load_error",
    "timeout",
    "threw_before_ready",
    "uncaught_error",
    "unhandled_rejection",
    "chunk_load",
    "unsupported_browser",
    ...ERROR_TYPES,
    "malformed"
  ]);
  var SHELL_RESERVED_ERROR_TYPE = "malformed";
  var RESERVED_VALUES = new Set([
    "invalid",
    "none",
    "overflow"
  ]);
  var APP_KEY_RE = /^[a-z0-9][a-z0-9-]{0,39}$/;
  var CHANNEL_RE = /^[a-z0-9][a-z0-9_-]{0,79}$/;
  var READY_TIMEOUT_S = { min: 5, max: 120, default: 20 };
  var WINDOW_MS = 15000;
  var MAX_REPORTS_PER_ACTION_PER_WINDOW = 1000;
  var SENTINEL = "appifact-health:v2";
  var HEALTH_GLOBAL = "__appifact_health";

  // ../../packages/appifact-health/src/health.ts
  var UNSUPPORTED_FALLBACK_MS = 8000;
  function awaitsUnsupportedVerdict(page, fileHref) {
    try {
      if (!page.watched)
        return false;
      const ver = /^\/_f\/([^/]{1,128})\//.exec(page.pathname)?.[1];
      if (ver === undefined)
        return false;
      const url = new URL(fileHref);
      return url.origin === page.origin && url.pathname.startsWith(`/_f/${ver}/`);
    } catch {
      return false;
    }
  }
  function failedLinkIsCrash(link, origin) {
    if (/(^|\s)(stylesheet|modulepreload)(\s|$)/i.test(link.rel))
      return true;
    if (!/(^|\s)preload(\s|$)/i.test(link.rel) || link.as !== "font")
      return false;
    try {
      return new URL(link.href).origin === origin;
    } catch {
      return false;
    }
  }
  function createVerdictGate(crash, env, fallbackMs = UNSUPPORTED_FALLBACK_MS) {
    let decided = null;
    let pending = false;
    let timer = null;
    let stopWatching = () => {};
    const decide = (type) => {
      if (decided === type || decided === "unsupported_browser")
        return;
      decided = type;
      pending = false;
      try {
        if (timer !== null)
          env.clearTimeout(timer);
        if (type === "unsupported_browser")
          stopWatching();
      } catch {}
      timer = null;
      crash(type);
    };
    const settle = () => {
      if (pending)
        decide(env.marked() ? "unsupported_browser" : "chunk_load");
    };
    try {
      env.onHide(settle);
    } catch {}
    return {
      fail(awaitsVerdict) {
        if (!awaitsVerdict) {
          crash("chunk_load");
          return;
        }
        if (decided !== null) {
          crash(decided);
          return;
        }
        if (pending)
          return;
        if (env.marked()) {
          decide("unsupported_browser");
          return;
        }
        pending = true;
        try {
          stopWatching = env.onMark(() => {
            if (env.marked())
              decide("unsupported_browser");
          });
        } catch {}
        timer = env.setTimeout(settle, fallbackMs);
      }
    };
  }
  var MAX_WARNINGS = 10;
  var READY_RESUME_FLOOR_MS = 1000;
  var APPIFACT_ERROR_TYPES = new Map([
    ["conflict", "conflict"],
    ["read-only", "read_only"],
    ["too-large", "too_large"],
    ["invalid-content", "invalid_content"],
    ["backpressure", "backpressure"],
    ["transient", "transient"]
  ]);
  function errorTypeOf(error) {
    if (typeof error === "object" && error !== null && "code" in error) {
      const code = error.code;
      if (typeof code === "string") {
        const mapped = APPIFACT_ERROR_TYPES.get(code);
        if (mapped !== undefined)
          return mapped;
      }
    }
    return "unknown";
  }
  var CHUNK_LOAD_MESSAGE = /dynamically imported module|Importing a module script failed|error loading dynamically imported module|Loading (CSS )?chunk|ChunkLoadError|Unable to preload/i;
  var BENIGN_WINDOW_ERROR = /^ResizeObserver loop (?:limit exceeded|completed with undelivered notifications)/;
  function isBenignWindowError(message) {
    return typeof message === "string" && BENIGN_WINDOW_ERROR.test(message);
  }
  function looksLikeChunkLoad(reason) {
    if (typeof reason !== "object" || reason === null)
      return false;
    const r = reason;
    return r.name === "ChunkLoadError" || typeof r.message === "string" && CHUNK_LOAD_MESSAGE.test(r.message);
  }
  function isCoreAction(value) {
    return typeof value === "string" && CORE_ACTIONS.includes(value);
  }
  function isOutcome(value) {
    return typeof value === "string" && OUTCOMES.includes(value);
  }
  function manifestProblem(manifest) {
    if (typeof manifest !== "object" || manifest === null) {
      return "init() takes the parsed artifact.json (an object with key and monitoring)";
    }
    const m = manifest;
    if (typeof m.key !== "string" || !APP_KEY_RE.test(m.key) || RESERVED_VALUES.has(m.key)) {
      return "artifact.json key is not a reportable app key";
    }
    const mon = m.monitoring;
    if (typeof mon !== "object" || mon === null) {
      return "artifact.json has no monitoring block";
    }
    if (typeof mon.alertChannel !== "string" || !CHANNEL_RE.test(mon.alertChannel) || RESERVED_VALUES.has(mon.alertChannel)) {
      return 'monitoring.alertChannel is not a Slack channel name (no "#")';
    }
    if (!Array.isArray(mon.coreActions) || !mon.coreActions.every(isCoreAction)) {
      return "monitoring.coreActions must list verbs from CORE_ACTIONS";
    }
    if (mon.readyTimeoutS !== undefined && !(Number.isInteger(mon.readyTimeoutS) && mon.readyTimeoutS >= READY_TIMEOUT_S.min && mon.readyTimeoutS <= READY_TIMEOUT_S.max)) {
      return `monitoring.readyTimeoutS must be a whole number from ${READY_TIMEOUT_S.min} to ${READY_TIMEOUT_S.max}`;
    }
    return null;
  }
  function inertHealth() {
    return {
      version: SENTINEL,
      ready() {},
      report() {},
      crash() {},
      replay() {},
      track: runTracked(() => {})
    };
  }
  function runTracked(report) {
    return async (action, operation, classify = errorTypeOf) => {
      let result;
      try {
        result = await operation();
      } catch (error) {
        let errorType = "unknown";
        try {
          errorType = classify(error);
        } catch {}
        report(action, "failure", errorType);
        throw error;
      }
      report(action, "success");
      return result;
    };
  }
  function createHealth(manifest, env) {
    const appKey = manifest.key;
    const alertChannel = manifest.monitoring.alertChannel;
    const declared = new Set(manifest.monitoring.coreActions);
    const readyTimeoutMs = (manifest.monitoring.readyTimeoutS ?? READY_TIMEOUT_S.default) * 1000;
    let warnings = 0;
    const warned = new Set;
    const warnOnce = (key, message) => {
      if (warnings >= MAX_WARNINGS || warned.has(key))
        return;
      warned.add(key);
      warnings += 1;
      try {
        env.warn(message);
      } catch {}
    };
    let windowCounts = new Map;
    let windowTimer = null;
    const send = (action, outcome, errorType, replayed) => {
      try {
        if (action !== "load" && action !== "ready" && action !== "crash") {
          const count = windowCounts.get(action) ?? 0;
          if (count >= MAX_REPORTS_PER_ACTION_PER_WINDOW) {
            warnOnce(`flood:${action}`, `"${action}" was reported more than ${MAX_REPORTS_PER_ACTION_PER_WINDOW} times in ${WINDOW_MS / 1000} s; the rest of this window's "${action}" reports are dropped — report once per user-level operation, not per element or frame`);
            return;
          }
          windowCounts.set(action, count + 1);
          if (windowTimer === null) {
            windowTimer = env.setTimeout(() => {
              windowTimer = null;
              windowCounts = new Map;
            }, WINDOW_MS);
          }
        }
        env.post({
          __frame_health: true,
          report: {
            appKey,
            alertChannel,
            action,
            outcome,
            ...errorType !== undefined && { errorType },
            ...replayed && { replayed }
          }
        });
      } catch {}
    };
    let readyOutcome = null;
    const crashes = new Set;
    let readyTimer = null;
    let readyLeftMs = readyTimeoutMs;
    let readyArmedAt = 0;
    const settleReady = (outcome, errorType) => {
      readyOutcome = { outcome, ...errorType !== undefined && { errorType } };
      send("ready", outcome, errorType);
    };
    const onReadyTimeout = () => {
      readyTimer = null;
      if (readyOutcome !== null)
        return;
      settleReady("failure", crashes.size > 0 ? "threw_before_ready" : "timeout");
    };
    const armReadyTimer = () => {
      if (readyOutcome !== null || readyTimer !== null)
        return;
      readyArmedAt = env.now();
      readyTimer = env.setTimeout(onReadyTimeout, readyLeftMs);
    };
    const pauseReadyTimer = () => {
      if (readyTimer === null)
        return;
      env.clearTimeout(readyTimer);
      readyTimer = null;
      readyLeftMs = Math.max(READY_RESUME_FLOOR_MS, readyLeftMs - (env.now() - readyArmedAt));
    };
    try {
      env.onVisibilityChange(() => {
        try {
          if (env.visible())
            armReadyTimer();
          else
            pauseReadyTimer();
        } catch {}
      });
      if (env.visible())
        armReadyTimer();
    } catch {
      try {
        armReadyTimer();
      } catch {}
    }
    const report = (action, outcome, errorType) => {
      if (!isCoreAction(action)) {
        warnOnce(`action:${String(action).slice(0, 32)}`, `report() dropped: "${String(action).slice(0, 32)}" is not one of the generic verbs (${CORE_ACTIONS.join(", ")})`);
        return;
      }
      if (!declared.has(action)) {
        warnOnce(`undeclared:${action}`, `report() dropped: "${action}" is not declared in artifact.json monitoring.coreActions for "${appKey}" — add it there so the schema, this module and the monitors agree`);
        return;
      }
      if (!isOutcome(outcome)) {
        warnOnce(`outcome:${action}`, `report("${action}", …) dropped: outcome must be one of ${OUTCOMES.join(", ")}`);
        return;
      }
      if (outcome !== "failure") {
        send(action, outcome);
        return;
      }
      let type = errorType ?? "unknown";
      if (typeof type !== "string" || !ERROR_TYPE_RE.test(type) || RESERVED_VALUES.has(type)) {
        warnOnce(`errorType:${action}`, `report("${action}", "failure", …): errorType must be a short snake_case token from ERROR_TYPES (never an error message); sent as "unknown"`);
        type = "unknown";
      } else if (type === SHELL_RESERVED_ERROR_TYPE) {
        warnOnce(`errorType!:${action}`, `report("${action}", "failure", "${type}"): "${type}" is the viewer shell's own label for an unusable error type, not one an app reports; sent as "unknown"`);
        type = "unknown";
      } else if (!KNOWN_ERROR_TYPES.has(type)) {
        warnOnce(`errorType?:${type}`, `report("${action}", "failure", "${type}"): "${type}" is not an error type Frame's page-health route knows (choose from ERROR_TYPES: ${ERROR_TYPES.join(", ")}); it is sent and counts as a failure, but Frame files it under "invalid" until its list gains it`);
      }
      send(action, "failure", type);
    };
    send("load", "success");
    return {
      version: SENTINEL,
      ready() {
        if (readyOutcome !== null)
          return;
        if (readyTimer !== null) {
          try {
            env.clearTimeout(readyTimer);
          } catch {}
          readyTimer = null;
        }
        settleReady("success");
      },
      report,
      track: runTracked(report),
      crash(errorType) {
        if (crashes.has(errorType))
          return;
        crashes.add(errorType);
        send("crash", "failure", errorType);
        if (errorType === "unsupported_browser" && readyOutcome === null) {
          if (readyTimer !== null) {
            try {
              env.clearTimeout(readyTimer);
            } catch {}
            readyTimer = null;
          }
          settleReady("failure", "unsupported_browser");
        }
      },
      replay() {
        send("load", "success", undefined, true);
        for (const type of crashes)
          send("crash", "failure", type, true);
        if (readyOutcome !== null) {
          send("ready", readyOutcome.outcome, readyOutcome.errorType, true);
        }
      }
    };
  }

  // ../../packages/appifact-health/src/index.ts
  var installed = null;
  var installedKey = null;
  var warnedSecondInit = false;
  function init(manifest) {
    const handle = install(manifest);
    try {
      globalThis[HEALTH_GLOBAL] = handle;
    } catch {}
    return handle;
  }
  function install(manifest) {
    if (installed !== null) {
      if (installedKey !== manifest?.key && !warnedSecondInit) {
        warnedSecondInit = true;
        warn(`init() was already called for "${installedKey}"; the call for "${String(manifest?.key).slice(0, 32)}" returns that first handle`);
      }
      return installed;
    }
    const problem = manifestProblem(manifest);
    if (problem !== null) {
      warn(`not reporting — ${problem}`);
      installed = inertHealth();
      installedKey = typeof manifest?.key === "string" ? manifest.key : null;
      return installed;
    }
    installedKey = manifest.key;
    if (!inReportingContext()) {
      installed = inertHealth();
      return installed;
    }
    const engine = createHealth(manifest, {
      post,
      setTimeout: (callback, ms) => window.setTimeout(callback, ms),
      clearTimeout: (handle) => window.clearTimeout(handle),
      now: () => performance.now(),
      visible: () => document.visibilityState !== "hidden",
      onVisibilityChange: (listener) => document.addEventListener("visibilitychange", listener),
      warn
    });
    wireCrashes((type) => engine.crash(type));
    wirePoke(() => engine.replay());
    installed = engine;
    return installed;
  }
  function inReportingContext() {
    try {
      return typeof window !== "undefined" && typeof location !== "undefined" && window.parent !== window && location.protocol === "https:";
    } catch {
      return false;
    }
  }
  function post(message) {
    window.parent.postMessage(message, "*");
  }
  function wirePoke(replay) {
    try {
      window.addEventListener("message", (event) => {
        try {
          if (event.source !== window.parent)
            return;
          const data = event.data;
          if (typeof data === "object" && data !== null && data.__frame_health_poke === true) {
            replay();
          }
        } catch {}
      });
    } catch {}
  }
  function warn(message) {
    try {
      if (typeof console !== "undefined")
        console.warn(`[${SENTINEL}] ${message}`);
    } catch {}
  }
  var WATCH_ATTR = "data-frame-refused-watch";
  var UNSUPPORTED_ATTR = "data-frame-unsupported";
  function wireCrashes(crash) {
    try {
      const html = document.documentElement;
      const gate = createVerdictGate(crash, {
        setTimeout: (callback, ms) => window.setTimeout(callback, ms),
        clearTimeout: (handle) => window.clearTimeout(handle),
        marked: () => html.hasAttribute(UNSUPPORTED_ATTR),
        onMark: (listener) => {
          const observer = new MutationObserver(listener);
          observer.observe(html, { attributes: true, attributeFilter: [UNSUPPORTED_ATTR] });
          return () => observer.disconnect();
        },
        onHide: (listener) => window.addEventListener("pagehide", listener)
      });
      const page = () => ({
        watched: html.hasAttribute(WATCH_ATTR),
        origin: location.origin,
        pathname: location.pathname
      });
      window.addEventListener("error", (event) => {
        try {
          if (event instanceof ErrorEvent) {
            if (isBenignWindowError(event.message))
              return;
            crash(looksLikeChunkLoad(event.error) ? "chunk_load" : "uncaught_error");
            return;
          }
          const target = event.target;
          if (target instanceof HTMLScriptElement || target instanceof HTMLLinkElement && failedLinkIsCrash(target, location.origin)) {
            const href = target instanceof HTMLScriptElement ? target.src : target.href;
            gate.fail(awaitsUnsupportedVerdict(page(), href));
          }
        } catch {}
      }, true);
      window.addEventListener("unhandledrejection", (event) => {
        try {
          crash(looksLikeChunkLoad(event.reason) ? "chunk_load" : "unhandled_rejection");
        } catch {}
      });
    } catch {}
  }

  // ../../packages/appifact-type-entry/ready.ts
  function onRuntimeMounted(cb, doc = document, id = "root") {
    const mounted = (root) => Array.from(root.children).some((c) => !c.hasAttribute("data-placeholder"));
    const watch = () => {
      const root = doc.getElementById(id);
      if (root === null)
        return;
      if (mounted(root))
        return cb();
      const mo = new MutationObserver(() => {
        if (!mounted(root))
          return;
        mo.disconnect();
        cb();
      });
      mo.observe(root, { childList: true });
    };
    if (doc.readyState === "loading")
      doc.addEventListener("DOMContentLoaded", watch);
    else
      watch();
  }

  // src/health.ts
  var health = init({ key, monitoring });
  onRuntimeMounted(() => health.ready(), document);
})();</script>

.t-title { font: 300 28px/1.25 var(--headline); margin: 0; letter-spacing: -0.005em; }
.t-lead { font: 400 17px/1.45 var(--sans); margin: 0; }
.t-body { font: 400 15px/1.5 var(--sans); margin: 0; }
.t-strong { font: 600 15px/1.4 var(--sans); margin: 0; }
.t-label { font: 400 15px/1.5 var(--sans); color: var(--ink-2); margin: 0; }
.t-caption { font: 400 13px/1.45 var(--sans); color: var(--ink-2); margin: 0; }
/* the firm's letter-spaced capitals: labels, tabs and quiet actions (a control style, as the firm's header links are) */
.caps { font: 500 12px/16px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; }

/* ── the app bar: white, a soft shadow under it; the name on the left, the sections and the firm's mark on the right ── */
.appbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 24px; min-height: 68px; padding: 0 max(32px, env(safe-area-inset-right, 0px)) 0 max(32px, env(safe-area-inset-left, 0px)); background: var(--surface); box-shadow: var(--shadow); }
.appbar__name { flex: 1 1 auto; min-width: 0; color: var(--ink-2); font: 400 15px/1.4 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 22px; align-items: stretch; align-self: stretch; }
.tab { background: none; border: 0; padding: 0 0 2px; color: var(--ink); border-bottom: 2px solid transparent; box-shadow: inset 0 -1px 0 transparent; display: inline-flex; align-items: center; white-space: nowrap; }
.tab:hover { border-bottom-color: var(--rule); }
.tab[aria-current="page"] { border-bottom-color: var(--accent); }
.firm { display: flex; align-items: center; gap: 0; padding-right: 18px; margin-right: 2px; border-right: 1px solid var(--rule); height: 34px; flex: none; }
.firm__name { font: 700 16px/24px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
/* a copy's attribution line is Goodwin's wording, so it wraps rather than being cut short */
#attribution { white-space: normal; overflow: visible; padding: 6px 0; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 max(32px, env(safe-area-inset-right, 0px)) 48px max(32px, env(safe-area-inset-left, 0px)); }
.view { display: flex; flex-direction: column; gap: 28px; padding-top: 28px; }

/* ── landing: the headline with the short orange rule under it, then the ways in ── */
.hero { display: flex; flex-direction: column; gap: 0; }
.hero__headline { font: 300 38px/46px var(--headline); letter-spacing: -0.01em; margin: 0; max-width: 26ch; }
.hero__headline::after, .rule::after { content: ""; display: block; width: 32px; height: 4px; margin-top: 14px; background: var(--accent); }
.hero__sub { margin-top: 14px; max-width: 52ch; }
.hero__by { margin-top: 6px; }
.entries { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 22px; }
.entry { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 18px 20px; min-height: 112px; background: var(--surface); border: 1px solid var(--control-edge); border-radius: var(--corner); color: var(--ink); }
.entry:hover { background: var(--sunk); }
.entry__label { display: flex; align-items: center; gap: 8px; font: 600 15px/1.35 var(--sans); }
.entry__label svg { flex: none; width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.entry--main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.entry--main:hover { background: var(--accent-deep); }
.entry--main .t-caption { color: var(--on-accent); }

/* the sample's label: one line, the "Sample data" tag and Goodwin's banner */
.banner { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--outline); border-radius: var(--corner); }
.tag { flex: none; display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--tint); color: var(--ink); font: 600 12px/1 var(--sans); }

/* ── a page head: the title with the short rule, and the actions about the whole page on the right ── */
.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 32px; flex-wrap: wrap; }
.phead__main { min-width: 0; flex: 1 1 520px; }
.phead__main .t-lead, .phead__main .t-caption { margin-top: 10px; max-width: 70ch; }
.actions { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.quiet { background: none; border: 0; padding: 4px 1px; color: var(--ink); box-shadow: inset 0 -1px 0 var(--rule); }
.quiet:hover { box-shadow: inset 0 -1px 0 var(--ink); }

/* ── the Map: each area a row, its tiles in a grid of four; each tile names its element, status and source ── */
.areas { display: flex; flex-direction: column; gap: 20px; }
.area { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.area__head { color: var(--ink); margin: 0; }
.mapblock { display: flex; flex-direction: column; gap: 10px; }
.area__cells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 4px; text-align: left; width: 100%; padding: 12px 14px 13px; border: 0; border-radius: var(--corner); min-height: 92px; color: var(--ink); }
.tile:hover { filter: brightness(0.97); }
.tile[data-status="not_addressed"] { background: var(--st-na); color: var(--st-na-ink); }
.tile[data-status="partially_addressed"] { background: var(--st-pa); color: var(--st-pa-ink); }
.tile[data-status="addressed"] { background: var(--st-ad); color: var(--st-ad-ink); }
.tile[data-status="not_enough_information"] { background: var(--st-ne); color: var(--st-ne-ink); box-shadow: inset 0 0 0 1px var(--rule); }
.tile__name { font: 600 15px/1.35 var(--sans); }
.tile__status { font: 400 13px/1.4 var(--sans); }
.tile__source { font: 400 13px/1.4 var(--sans); margin-top: auto; padding-top: 6px; }
.tile[data-open="true"] { box-shadow: 0 0 0 2px var(--ink); }
.divider { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; }

/* ── below the tiles: the lead, the priority cards, the role question, the questions and the ending ── */
.section { display: flex; flex-direction: column; gap: 14px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; gap: 8px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--outline); border-top: 4px solid var(--accent); border-radius: var(--corner); }
.card .t-caption { color: var(--ink-2); }

.section__head { font-size: 17px; }
.panel { padding: 20px 22px; background: var(--surface); border: 1px solid var(--outline); border-radius: var(--corner); display: flex; flex-direction: column; gap: 12px; }
.roles { display: flex; flex-wrap: wrap; gap: 10px; }
.choice { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--control-edge); background: var(--surface); text-align: left; }
.choice:hover { background: var(--sunk); }
.choice[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.choice svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; flex: none; }
.qlist { margin: 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 8px; list-style: disc; }
.qlist li { padding-left: 4px; }
.ending { max-width: 80ch; }
.download { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
.contact { max-width: 760px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 20px; border-radius: 999px; border: 0; text-decoration: none; white-space: nowrap; }
.btn--primary { background: var(--accent); color: var(--on-accent); font: 600 12px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; }
.btn--primary:hover { background: var(--accent-deep); }
.btn--primary::after { content: "\2192"; font-size: 15px; letter-spacing: 0; line-height: 1; }
.btn--line { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--control-edge); font: 600 14px/1 var(--sans); }
.btn--line:hover { background: var(--sunk); }
.btnrow { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.address { font: 400 15px/1.5 var(--sans); color: var(--ink); user-select: all; }
.foot { border-top: 1px solid var(--rule); padding-top: 14px; }
.foot p { max-width: 110ch; }
.foot .important { margin-bottom: 10px; }
.important strong { font-weight: 600; }
.view > .important { max-width: 110ch; }
.foot .legend { margin-top: 10px; }
.legend strong { font-weight: 600; }
.contact__step { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.agree { display: flex; align-items: flex-start; gap: 10px; }
.agree input { flex: none; width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--control-edge); cursor: pointer; }
.agree label { cursor: pointer; }
.agree input:focus-visible { outline: 2px solid var(--control-edge); outline-offset: 2px; box-shadow: none; }
.note { color: var(--ink-2); }

/* ── Goodwin's baseline: the four areas side by side ── */
#baseline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
#baseline .area__head { padding: 0 2px 8px; border-bottom: 1px solid var(--rule); min-height: 42px; display: flex; align-items: flex-end; color: var(--ink); }
.btiles { display: flex; flex-direction: column; gap: 8px; }
.btile { padding: 14px 16px; background: var(--surface); border: 1px solid var(--outline); border-radius: var(--corner); display: flex; flex-direction: column; gap: 6px; }

/* ── the Health Check: one question at a time ── */
.check { max-width: 760px; display: flex; flex-direction: column; gap: 22px; padding-top: 20px; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 2px 0; color: var(--ink); box-shadow: inset 0 -1px 0 var(--rule); }
.back:hover { box-shadow: inset 0 -1px 0 var(--ink); }
.back svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width 200ms ease; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 12px 18px; text-align: left; background: var(--surface); border: 1px solid var(--control-edge); border-radius: var(--corner); font: 400 15px/1.4 var(--sans); color: var(--ink); }
.opt:hover { background: var(--sunk); }
.opt[aria-checked="true"] { background: var(--accent-soft); border-color: var(--flag-ink); box-shadow: inset 0 0 0 1px var(--flag-ink); color: var(--ink); }
/* Back and Next stay in one place from question to question: room for three lines of question and six options */
#check-title { min-height: 108px; }
.check__body { min-height: 410px; display: flex; flex-direction: column; gap: 14px; }
.check__progress { display: flex; flex-direction: column; gap: 8px; }
.check__meta { display: flex; justify-content: space-between; gap: 12px; }
/* Back and Next stay in view at the foot of the window on short screens, over the same patterned ground as the page */
.check__nav { position: sticky; bottom: 0; z-index: 4; display: flex; justify-content: space-between; align-items: center; padding: 16px 0 calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); background-color: var(--ground); background-image: var(--hex); background-attachment: fixed; }
.check > .t-title { font-weight: 400; color: var(--ink); }
.check .opt { scroll-margin-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.btn--next { background: var(--accent); color: var(--on-accent); font: 600 14px/1 var(--sans); min-width: 96px; }
.btn--next:hover { background: var(--accent-deep); }
.btn--next:disabled { opacity: 0.45; cursor: default; background: var(--accent); }
.opt svg { margin-left: auto; width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; flex: none; }

/* ── the side sheet over the right edge: a tile's detail or the Health Check questions ── */
body.has-sheet { overflow: hidden; }
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
.sheet { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(500px, 100%); background: var(--surface); border-left: 1px solid var(--outline); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.sheet__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px 24px; border-bottom: 1px solid var(--line); }
.sheet__nav { display: flex; gap: 4px; margin-left: auto; }
.icon { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: none; color: var(--ink); }
.icon:hover { background: var(--sunk); }
.icon:disabled { color: var(--ink-3); opacity: 0.4; cursor: default; background: none; }
.icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.sheet__body { flex: 1 1 auto; overflow: auto; overscroll-behavior: contain; padding: 16px 24px 28px; display: flex; flex-direction: column; gap: 22px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field--rule { border-top: 1px solid var(--line); padding-top: 16px; }
.sheet__head { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.pill { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 999px; font: 600 13px/1 var(--sans); }
.pill[data-status="not_addressed"] { background: var(--st-na); color: var(--st-na-ink); }
.pill[data-status="partially_addressed"] { background: var(--st-pa); color: var(--st-pa-ink); }
.pill[data-status="addressed"] { background: var(--st-ad); color: var(--st-ad-ink); }
.pill[data-status="not_enough_information"] { background: var(--st-ne); color: var(--st-ne-ink); }

.field > h3.t-caption { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.qrow { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; padding: 10px 16px; border-radius: 8px; background: var(--ink); color: var(--surface); font: 400 14px/1.4 var(--sans); }

@media (max-width: 1080px) { .area__cells, #baseline { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cards { grid-template-columns: 1fr; } }
@media (max-width: 860px) { .hero, .ending { grid-template-columns: 1fr; } .hero__headline { font-size: 30px; line-height: 38px; } }
@media (max-width: 960px) {
  .appbar { flex-wrap: wrap; gap: 4px 12px; padding-top: 10px; }
  .appbar__name { flex: 1 1 0; }
  .tabs { order: 3; width: 100%; height: 40px; overflow-x: auto; scrollbar-width: none; }
}
@media (max-width: 640px) {
  .area__cells, #baseline, .entries { grid-template-columns: 1fr; }
  .appbar { padding: 10px 16px 0; }
  .firm { padding-right: 12px; height: 28px; }
  .tabs { gap: 10px; }
  .tab { letter-spacing: 0.04em; font-size: 11px; }
  .wrap { padding-left: 16px; padding-right: 16px; }
}
@media print { .appbar, .scrim, .sheet { display: none !important; } body { background: #fff; } }

<script type="application/json" id="content">{"copy":{"productName":"Goodwin AI Governance Benchmark","outputName":"AI Governance Map","headline":"Benchmark your AI governance in minutes.","subhead":"Compare your current approach with the governance elements Goodwin looks for in a practical AI program.","byline":"Based on the Health Check conversations Goodwin’s AI practice runs with companies.","roleQuestion":{"prompt":"What is your role?","options":[{"id":"owner","label":"I own or advise on AI governance at my company"},{"id":"employee","label":"I work at the company but don’t own governance"},{"id":"explorer","label":"I’m exploring what good looks like"}]},"entryButtons":[{"id":"explore","label":"Explore Goodwin’s baseline","sub":"What should an AI governance program include?"},{"id":"check","label":"Take the five-minute Health Check","sub":"How does our current approach compare?"}],"statusLabels":{"addressed":"Addressed","partially_addressed":"Partially addressed","not_addressed":"Not addressed","not_enough_information":"Not enough information"},"sourceLabels":{"answer":"Your answer","document":"Your document","answer_with_document":"Your answer, supported by your document","document_with_answer":"Your document, confirmed by your answer","document_unconfirmed":"Your document. Whether it is followed was not confirmed.","none":"Not established from the information provided"},"dontKnowNote":"Choose “Don’t know” if you’re not sure.","map":{"title":"Your AI Governance Map","priorities_heading":"Three areas to look at first","priorities_heading_two":"Two areas to look at first","visibility_heading":"Start with visibility","questions_heading_owner":"Questions you might consider with your board or governance committee","questions_heading_employee":"Questions you might raise with Legal","questions_heading_explorer":"Questions a company might consider","priorities_lead":"Your Map shows where your current approach aligns with Goodwin’s baseline and the areas worth examining first.","questions_framing_note":"Examples to prompt discussion. Which matter most depends on your company’s facts.","priorities_heading_one":"One area to look at first","none":"None of your answers points to an area to look at first, so the next step is keeping your program current as your use of AI and the law change. Goodwin helps companies answer the questions their policies don’t cover, such as a new tool, use or data, and keep their governance documents up to date as AI law develops."},"endings":{"employee":"You answered what you could see from where you sit. These are the questions to take to Legal. Download the Map to share it.","explorer":"This is what a practical AI governance program addresses, and the questions a company should be able to answer."},"cta":{"downloadLabel":"Download your AI Governance Map","heading":"Want to discuss your results?","text":"Goodwin’s AI practice advises companies, boards and investors on AI governance. If you’d like to talk about your Map, contact the team.","buttonLabel":"Contact Goodwin’s AI Governance team","subject":"AI Governance Health Check (via Claude)","body":"I’d like to discuss an AI Governance Health Check with Goodwin.","pdfLine":"To discuss your results with Goodwin, use the contact step in the AI Governance Benchmark."},"disclaimer":"Prepared with Claude using Goodwin’s Health Check questions. This check does not confirm that your documents are scoped so that each AI use case meets the legal requirements that apply to it, or that tools that introduce legal risk have appropriate mitigations. Those questions need review by a lawyer.","importantNote":{"label":"Important Note:","tool":"AI Governance Benchmark (the “Tool”)","text":"Your use of the {tool} does not make you a client of Goodwin or create an attorney-client relationship. Goodwin lawyers do not review the results generated by the Tool, and those results do not constitute legal advice. The Tool’s results are generated automatically from your answers, and any responses from Claude may contain errors. Results may not be correct, complete, applicable to your specific scenario, or consistent with jurisdiction-specific requirements. Before uploading any confidential or privileged documents or other information, you should carefully consider any risk that doing so may result in the loss of confidentiality or any applicable protections."},"advertisingLegend":{"label":"Attorney Advertising.","text":"This tool may be considered advertising under the ethical rules of certain jurisdictions. Prior results do not guarantee a similar outcome."},"attribution":"Based on Goodwin’s AI Governance Benchmark.","sampleBanner":"Sample company. Harlow Diagnostics is invented. Replace it with your own answers or documents.","basedOn":"Based on"},"areas":["AI use and accountability","Policy, data and training","Tools, vendors and risk review","Board oversight and incident response"],"questions":[{"id":"Q01","name":"AI use today","area":"AI use and accountability","question":"Which best describes AI use at your company today?","options":[{"label":"Limited pockets","status":"partially_addressed"},{"label":"Broad but informal","status":"not_addressed"},{"label":"Broad with a formal program","status":"addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q02","name":"Inventory of tools and use cases","area":"AI use and accountability","question":"Does a current list exist of the AI tools and use cases in operation across the company?","options":[{"label":"Yes, maintained","status":"addressed"},{"label":"Partial or stale","status":"partially_addressed"},{"label":"No","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q03","name":"Adoption process","area":"AI use and accountability","question":"If a team wanted to adopt a new AI tool next week, is there a defined process they would have to go through?","options":[{"label":"Yes, and it’s followed","status":"addressed"},{"label":"Exists but often bypassed","status":"partially_addressed"},{"label":"Defined, not yet implemented","status":"partially_addressed"},{"label":"No","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q04","name":"Who approves a new use case","area":"AI use and accountability","question":"Who can approve a new AI use case today?","options":[{"label":"A named role or body","status":"addressed"},{"label":"Unclear, varies by team","status":"partially_addressed"},{"label":"No one designated","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q05","name":"Acceptable-use policy","area":"Policy, data and training","question":"Does the company have an AI acceptable-use policy that covers current generative AI tools and has been communicated to employees?","options":[{"label":"Yes, current and communicated","status":"addressed"},{"label":"Exists but needs updating or broader communication","status":"partially_addressed"},{"label":"Draft or awaiting launch","status":"partially_addressed"},{"label":"No","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q06","name":"Data-input rules","area":"Policy, data and training","question":"Are there clear rules on what information employees may and may not put into AI tools, including public chatbots?","options":[{"label":"Yes","status":"addressed"},{"label":"Partly","status":"partially_addressed"},{"label":"No","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q07","name":"Notetakers and transcripts","area":"Policy, data and training","question":"Are AI meeting notetakers or transcription tools in use in company meetings, and if so, do you know where the transcripts are stored, who can access them, and how long they’re kept?","options":[{"label":"Not used, no planned use","status":"partially_addressed"},{"label":"Not used internally, but rollout or third-party use needs guidance","status":"partially_addressed"},{"label":"In use, and yes","status":"addressed"},{"label":"In use, partially","status":"partially_addressed"},{"label":"In use, and no","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q08","name":"Training","area":"Policy, data and training","question":"Have employees received any training or guidance on using AI tools for work?","options":[{"label":"Yes, formal","status":"addressed"},{"label":"Informal or ad hoc","status":"partially_addressed"},{"label":"Planned, not yet delivered","status":"partially_addressed"},{"label":"No","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q09","name":"Vendor AI assessment","area":"Tools, vendors and risk review","question":"When the company buys software today, does anyone assess the vendor’s AI components and data practices?","options":[{"label":"Yes, routinely","status":"addressed"},{"label":"Sometimes","status":"partially_addressed"},{"label":"No","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q10","name":"Legal applicability","area":"Tools, vendors and risk review","question":"Has the company determined which AI-specific legal requirements currently apply to it (state automated-decision and employment rules, EU AI Act, sector guidance)?","options":[{"label":"Yes, documented","status":"addressed"},{"label":"Informally","status":"partially_addressed"},{"label":"No","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q11","name":"Board rules and oversight","area":"Board oversight and incident response","question":"Does the board have defined rules for directors’ own use of AI, and a clear process for overseeing the company’s AI program?","options":[{"label":"Both","status":"addressed"},{"label":"Director-use rules only","status":"partially_addressed"},{"label":"Oversight process only","status":"partially_addressed"},{"label":"Neither","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]},{"id":"Q12","name":"Incident handling","area":"Board oversight and incident response","question":"If an AI tool caused a problem tomorrow (a wrong output to a customer, a transcript in the wrong hands, a complaint), is it clear who handles it and how?","options":[{"label":"Yes","status":"addressed"},{"label":"Partly","status":"partially_addressed"},{"label":"No","status":"not_addressed"},{"label":"Don’t know","status":"not_enough_information"}]}],"baseline":{"label":"Goodwin’s practical governance baseline","framing":"A practical program scopes its documents so that each AI use case meets the legal requirements that apply to it, and tools that introduce legal risk carry appropriate mitigations. The twelve elements below are how Goodwin checks whether that is in place.","items":[{"id":"Q01","statement":"Someone at the company has a picture of actual AI use, not only sanctioned use, and there is a program around it.","why":"Nobody can govern what nobody has seen."},{"id":"Q02","statement":"A current list of AI tools and use cases exists and someone owns keeping it current.","why":"A list is one of the first things a regulator, insurer or acquirer may ask for, and the first thing a program is built on."},{"id":"Q03","statement":"A new AI tool or use case goes through a defined process, and teams actually use it.","why":"Without a defined path, new tools arrive through expense reports and personal accounts."},{"id":"Q04","statement":"A named role or body approves new AI use cases, and people know to go there.","why":"If no one is named, every team is its own approver."},{"id":"Q05","statement":"An acceptable-use policy covers current generative AI tools and employees have seen it.","why":"A policy written before generative AI does not cover the tools employees use today."},{"id":"Q06","statement":"Written rules say what information may and may not go into AI tools, including personal accounts and public chatbots.","why":"Confidential information typed into a public tool cannot be called back."},{"id":"Q07","statement":"If AI notetakers or transcription are in use, the company knows where transcripts are stored, who can access them and how long they are kept.","why":"Transcripts are records. Someone has to decide where they live, who can see them and how long they last."},{"id":"Q08","statement":"Employees have received formal training or guidance on using AI tools for work, with updates since rollout.","why":"A policy no one has been trained on is a document, not a practice."},{"id":"Q09","statement":"Vendor intake routinely asks about AI components and data practices before software is bought.","why":"Vendors add AI features between contract cycles. Intake is the only point where anyone asks."},{"id":"Q10","statement":"The company has determined and documented which AI-specific legal requirements apply to it.","why":"Whether AI-specific rules apply depends on what a company uses AI for and where it operates."},{"id":"Q11","statement":"The board has rules for directors’ own use of AI and a defined process for overseeing the company’s AI program.","why":"Boards are expected to oversee material risks, and directors use AI themselves with board materials."},{"id":"Q12","statement":"The incident plan names AI, and it is clear who leads if an AI tool causes a problem.","why":"The first AI incident tests whether anyone knows it is theirs to handle."}],"observations":[],"marketContext":[]},"priority":{"map":[{"question":"Q01","gap":"G11","triggers":["Broad but informal"],"line":"AI use is broad across the company but informal, without a program around it."},{"question":"Q02","gap":"G01","triggers":["No","Partial or stale"],"line":"There is no current list of the AI tools and use cases in operation across the company."},{"question":"Q03","gap":"G02","triggers":["No","Exists but often bypassed"],"line":"There is no followed process, or named approver, for bringing in a new AI tool or use case."},{"question":"Q04","gap":"G02","triggers":["No one designated","Unclear, varies by team"],"line":"There is no followed process, or named approver, for bringing in a new AI tool or use case."},{"question":"Q05","gap":"G03","triggers":["No","Exists but needs updating or broader communication","Draft or awaiting launch"],"line":"The AI acceptable-use policy is missing, or doesn’t cover current generative AI tools, or hasn’t reached the employees it governs."},{"question":"Q06","gap":"G04","triggers":["No","Partly"],"line":"Employees don’t have clear rules on what information may go into AI tools, including public chatbots."},{"question":"Q07","gap":"G05","triggers":["In use, and no","In use, partially","Not used internally, but rollout or third-party use needs guidance"],"line":"AI notetakers are in use without clear answers on where transcripts are stored, who can access them and how long they’re kept."},{"question":"Q08","gap":"G06","triggers":["No","Informal or ad hoc"],"line":"Employees haven’t had training or practical guidance on using AI tools for work."},{"question":"Q09","gap":"G07","triggers":["No","Sometimes"],"line":"No one routinely assesses a vendor’s AI components and data practices when the company buys software."},{"question":"Q10","gap":"G08","triggers":["No","Informally"],"line":"The company hasn’t determined and documented which AI-specific legal requirements apply to it."},{"question":"Q11","gap":"G09a","triggers":["Oversight process only"],"line":"The board has no defined rules for directors’ own use of AI with board materials."},{"question":"Q11","gap":"G09b","triggers":["Director-use rules only"],"line":"The board has no clear process for overseeing the company’s AI program."},{"question":"Q11","gap":"G09c","triggers":["Neither"],"line":"The board has neither rules for directors’ own AI use nor a process for overseeing the company’s AI program."},{"question":"Q12","gap":"G10","triggers":["No","Partly"],"line":"It isn’t clear who would handle an AI-related problem, or how."}],"visibility":{"gap":"G12","line":"Several core governance questions couldn’t be answered from where the legal team sits.","follow":"Start by confirming what is actually in use before anything else."},"order":["G03","G05","G04","G02","G07","G09c","G09a","G09b","G10","G01","G06","G08","G11"],"questions":{"G01":"Who keeps the list of AI tools we use, and when was it last updated?","G02":"Who decides whether a new AI tool can be used?","G03":"When was our AI policy last updated, and does it cover the tools we use now?","G04":"What information can go into AI tools, and where is that written down?","G05":"Are our meetings being transcribed, and who can see the transcripts?","G06":"What training or guidance have people had on AI tools, and is more planned?","G07":"When we buy software, does anyone ask whether it uses AI and what it does with our data?","G08":"Which AI-specific laws apply to the company, and has anyone confirmed it?","G10":"If an AI tool caused a problem tomorrow, who would handle it?","G11":"Who is responsible for AI at the company?","G12":"Who at the company could answer these questions?","G09a":"Do directors have rules for their own use of AI with board materials?","G09b":"How does the board oversee the company’s use of AI, and how often does it hear about it?","G09c":"Has the board been briefed on how we use AI, and do directors have rules for their own use?"},"titles":{"G01":{"No":"There is no list of the AI tools in use","Partial or stale":"The list of AI tools in use is partial or out of date"},"G02":{"No":"There is no process for bringing in a new AI tool","Exists but often bypassed":"The process for new AI tools exists but is often bypassed","No one designated":"No one is designated to approve new AI uses","Unclear, varies by team":"Who approves a new AI use varies by team"},"G03":{"No":"There is no AI acceptable-use policy","Exists but needs updating or broader communic dy","Q05":"Exists but needs updating or broader communication","Q06":"Partly","Q07":"In use, partially","Q08":"Don’t know","Q09":"Yes, routinely","Q10":"No","Q11":"Neither","Q12":"Partly"},"tiles":{"Q01":{"source":"answer"},"Q02":{"source":"answer"},"Q03":{"source":"answer","note":"You report it is often bypassed."},"Q04":{"source":"answer","note":"You confirm a named approver for AI use cases."},"Q05":{"source":"answer"},"Q06":{"source":"answer"},"Q07":{"source":"answer"},"Q08":{"source":"none"},"Q09":{"source":"answer"},"Q10":{"source":"answer"},"Q11":{"source":"answer"},"Q12":{"source":"answer"}},"whys":{"G09c":"You answered “Neither”."}}}</script>

  /* character: [WinAnsi code, Helvetica, Helvetica-Bold, Times-Roman, Times-Bold] */
  const EX = {"‘":[145,222,278,333,333],"’":[146,222,278,333,333],"“":[147,333,500,444,500],"”":[148,333,500,444,500],"•":[149,350,350,350,350],"–":[150,556,556,500,500],"—":[151,1000,1000,1000,1000]," ":[160,278,278,250,250],"§":[167,556,556,500,500],"·":[183,278,278,250,250],"…":[133,1000,1000,1000,1000],"é":[233,556,556,444,444]};

    doc.rect = (x, y, w, h, fill) => { if (!cmds) doc.newPage(); cmds.push(rgb(fill) + ' rg ' + num(x) + ' ' + num(o.height - y - h) + ' ' + num(w) + ' ' + num(h) + ' re f'); return doc; };

      const catalog = add(null), pagesObj = add(null);

      const fonts = KEYS.map((k) => add('<< /Type /Font /Subtype /Type1 /BaseFont /' + FONTS[k][0] + ' /Encoding /WinAnsiEncoding /FirstChar 32 /LastChar 255 /Widths [' + widths(k) + '] >>'));

<script>/* The AI Governance Map worked out from answers: statuses, sources, the areas to look at first and the questions for
   decision-makers. Pure functions over script#content, no DOM. The rules are Goodwin's; where they leave a case open, the choice
   is commented where it is made and listed in the folder's README. */
(function (root) {
  'use strict';
  const DK = 'Don\u2019t know';
  /* The words this page adds to Goodwin's own, in one place, so they can be listed for Goodwin's review; the Questions tab's label is Goodwin's. */

    pdfPage: 'Page {n} of {total}',
  };
  const fill = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in v ? String(v[k]) : m));

  /* The Map. answers: { Q01: option label, ... }; a question with no answer gets no status, source or priority. opts.sample: the
     sample company's Map, whose sources, notes and priority sentences are the sample's own. */
  function compute(C, answers, opts) {
    const o = Object.assign({ sample: false, titleVariants: true }, opts || {});
    const S = C.sample, labels = C.copy.statusLabels, sources = C.copy.sourceLabels;
    const base = Object.fromEntries(C.baseline.items.map((b) => [b.id, b]));
    const tiles = [], statuses = {}, raised = new Map();
    for (const q of C.questions) {
      const a = answers[q.id];
      const opt = q.options.find((x) => x.label === a) || null;
      const status = opt ? opt.status : null;
      statuses[q.id] = status;
      if (opt) for (const m of C.priority.map) if (m.question === q.id && m.triggers.includes(a)) {
        if (!raised.has(m.gap)) raised.set(m.gap, []);
        raised.get(m.gap).push({ q: q.id, option: a, status, line: m.line });

      let source = !opt ? null : a === DK ? 'none' : 'answer';
      const t = o.sample && S.tiles[q.id] ? S.tiles[q.id] : null;
      if (t && opt) source = sourceOf(t, a);
      tiles.push({
        id: q.id, name: q.name, area: q.area, question: q.question, status, statusLabel: status ? labels[status] : null, answer: a == null ? null : a,
        source, sourceLabel: source ? sources[source] : null, category: source ? categoryOf(source) : null,
        evidence: t && t.evidence ? t.evidence : null, flag: t && t.flag ? t.flag : null, note: t && t.note ? t.note : null,
        baseline: base[q.id] ? base[q.id].statement : null,
      });
    }
    const dkCount = C.questions.filter((q) => answers[q.id] === DK).length;
    /* three, not the four in Goodwin's priority rules: their later review lowered it */
    const visibility = dkCount >= 3;
    const ranked = C.priority.order.filter((g) => raised.has(g));
    const byNA = (g) => raised.get(g).some((r) => r.status === 'not_addressed');
    const anyNA = Object.values(statuses).includes('not_addressed');
    /* Goodwin's rule: the first three gaps in order; if any answer is Not addressed and none of those came from one, the last is

      h('div', { class: 'areas', id: 'baseline' }, C.areas.map((a, i) => h('section', { class: 'area', 'aria-labelledby': 'barea-' + i },
        h('h3', { class: 'area__head t-strong', id: 'barea-' + i, text: a }),
        h('div', { class: 'btiles' }, B.items.filter((b) => byId[b.id] && byId[b.id].area === a).map((b) => h('article', { class: 'btile' },
          h('span', { class: 't-strong', text: byId[b.id].name }),

      h('div', { class: 'btnrow' }, h('button', { class: 'btn btn--primary', type: 'button', onclick: startCheck }, checkBtn.label)),

  }


  // ── the Health Check: one question at a time; the baseline is never on these screens ──
  function startCheck() {

  // ── the side sheet ──
  function openTile(id) { lastFocus = 'tile-' + id; go({ sheet: { kind: 'tile', id } }); }
  function closeSheet() {
    const id = S.sheet && S.sheet.id;

        base ? h('div', { class: 'field field--rule' }, h('h3', { class: 't-strong', text: OURS.baselineLabel }), h('p', { class: 't-body', text: base.statement }), h('p', { class: 't-caption', text: OURS.whyItMatters + ' ' + base.why })) : null));
  }
  function questionsSheet() {
    return h('aside', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'sheet-title', id: 'qs-sheet' },
      h('div', { class: 'sheet__bar' }, h('span', null), h('div', { class: 'sheet__nav' }, closeBtn())),
      h('div', { class: 'sheet__body', tabindex: '0' },
        h('h2', { class: 't-title', id: 'sheet-title', text: OURS.questionsPanel }),
        h('div', { class: 'kv' }, h('span', { class: 't-label', text: OURS.versionLabel }), h('span', { class: 't-body', text: OURS.version }), h('span', { class: 't-label', text: OURS.ownerLabel }), h('span', { class: 't-body', text: OURS.owner })),
        C.areas.map((a) => h('div', { class: 'field' }, h('h3', { class: 't-caption', text: a }), C.questions.filter((q) => q.area === a).map((q) => h('div', { class: 'qrow' }, h('span', { class: 't-strong', text: q.name }), h('span', { class: 't-body', text: q.question })))))));
  }

  // ── the Map as a PDF ──
  const PDF_STATUS = { not_addressed: [233, 153, 62], partially_addressed: [248, 216, 173], addressed: [211, 233, 203], not_enough_information: [225, 227, 229] };
  function mapPdf(m, r) {
    const ink = [47, 53, 57], grey = [79, 86, 90], P = root.GWPDF;
    /* the last page has no page-number line, so nothing on it comes after Goodwin's advertising legend */
    const doc = P.create({ margin: 54, marginBottom: 60, footer: (n, total) => (n === total ? [] : [{ x: 54, y: 760, size: 8, color: grey, text: PRODUCT + ' \u00b7 ' + E.fill(OURS.pdfPage, { n, total }) }]) });
    doc.newPage();
    doc.text(BRANDED ? C.copy.productName : C.copy.attribution, { font: 'helvB', size: 9, color: grey });
    doc.space(6);
    doc.text(m.title, { font: 'helv', size: 18, lead: 23, color: ink });
    doc.rect(54, doc.y + 6, 24, 3, [233, 153, 62]); doc.space(16);
    /* Goodwin's Important Note under the title, no smaller than the body text further down */
    doc.runs([{ s: NOTE.label, font: 'helvB' }, { s: NOTE.text, font: 'helv' }], { size: 10.5, color: ink }); doc.space(12);
    /* Goodwin wants only the banner's first two sentences in the PDF */
    if (m.sample) { doc.text(BANNER.split(/(?<=\.) +/).slice(0, 2).join(' '), { size: 9.5, color: grey }); doc.space(6); }
    const width = doc.right - 70, rows = (s, f, z) => P.wrap(s, f, z, width).length;
    const tileLines = (t) => {
      const lines = [];
      const base = C.baseline.items.find((b) => b.id === t.id);
      if (t.answer) lines.push(OURS.answerLabel + ': ' + t.answer);
      if (t.note) lines.push(t.note);
      if (base) { lines.push(OURS.baselineLabel + ': ' + base.statement); lines.push(OURS.whyItMatters + ' ' + base.why); }
      return lines;
    };
    const tileHeight = (t) => 6 + 13.5 + rows(t.question, 'helv', 9.5) * 12.8 + tileLines(t).reduce((n, l) => n + rows(l, 'helv', 8.8) * 11.9, 0);
    for (const a of C.areas) {
      const tiles = m.tiles.filter((x) => x.area === a);
      /* an area's heading stays with its first tile, and a tile is kept on one page */
      doc.ensure(8 + 16 + tileHeight(tiles[0])); doc.space(8);
      doc.text(a, { font: 'helvB', size: 11, color: ink }); doc.space(2);
      for (const t of tiles) {
        const lines = tileLines(t);
        doc.ensure(tileHeight(t));
        doc.space(6);
        doc.rect(54, doc.y + 3, 10, 10, PDF_STATUS[t.status] || [255, 255, 255]);
        doc.text(t.name + ' \u00b7 ' + (t.statusLabel || ''), { font: 'helvB', size: 10, x: 70, color: ink });
        doc.text(t.question, { size: 9.5, x: 70, color: ink });
        for (const l of lines) doc.text(l, { size: 8.8, x: 70, color: grey });

    }
    doc.space(10); doc.ensure(40);
    doc.text(m.lead, { size: 10.5, color: ink });
    doc.space(10); doc.ensure(60);
    if (m.cards.length) {
      doc.text(m.heading, { font: 'helvB', size: 12, color: ink });
      for (const c of m.cards) {
        const cw = doc.right - doc.left, cr = (s, f, z) => P.wrap(s, f, z, cw).length;
        doc.ensure(6 + cr(c.title, 'helvB', 10.5) * 14.2 + (c.line ? cr(c.line, 'helv', 10) * 13.5 : 0) + cr(c.why, 'helv', 10) * 13.5);
        doc.space(6);
        doc.text(c.title, { font: 'helvB', size: 10.5, color: ink });
        if (c.line) doc.text(c.line, { size: 10, color: ink });
        doc.text(c.why, { size: 10, color: ink });
      }
    }
    if (m.questions.length) {
      doc.space(12); doc.ensure(60);
      doc.text(E.questionsHeading(C, r), { font: 'helvB', size: 12, color: ink });
      doc.text(m.framingNote, { size: 9.5, color: grey });
      m.questions.forEach((q) => { doc.space(3); doc.text('\u2022  ' + q, { size: 10, color: ink }); });
    }
    /* as on the page, the sample's Map has no ending sentence */
    const lead = m.sample ? null : E.endingLead(C, r);
    if (lead) { doc.space(12); doc.ensure(40); doc.text(lead, { size: 10.5, color: ink }); }
    if (m.none) { doc.space(12); doc.ensure(40); doc.text(m.none, { size: 10.5, color: ink }); }
    doc.space(12); doc.ensure(70);
    doc.text(C.copy.cta.heading, { font: 'helvB', size: 11, color: ink });
    doc.text(C.copy.cta.text, { size: 10, color: ink });
    doc.text(C.copy.cta.pdfLine, { font: 'helvB', size: 10, color: ink });

    const fw = doc.right - doc.left, legend = [{ s: LEGEND.label, font: 'helvB' }, { s: LEGEND.text, font: 'helv' }];
    const endHeight = P.wrap(C.copy.disclaimer, 'helv', 8.5, fw).length * 8.5 * 1.35 + 10 + P.wrap(LEGEND.label + ' ' + LEGEND.text, 'helvB', 10, fw).length * 13.5;
    doc.space(14); doc.ensure(endHeight);

  }
  root.GWPage = { mapPdf: (r) => mapPdf(model(), r === undefined ? role() : r), model, state: S, branded: BRANDED };
  async function download() {
    if (!S.downloads) return;
    let bytes;
    try { bytes = mapPdf(model(), role()); } catch (e) { toast(OURS.downloadFailed); return; }
    try { await S.downloads.save({ filename: C.copy.outputName + '.pdf', data: bytes }); }
    catch (e) { const code = e && e.code; if (code === 'declined') return; if (code === 'rate_limited') { toast(OURS.downloadOpen); return; } if (code === 'unavailable' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') { S.downloads = null; render(); return; } toast(OURS.downloadFailed); }
  }

  }
